<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dexxnt | Proyectos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link rel="stylesheet" href="css/style.css?v=1.3" />
</head>

<body>
  <div class="frame-overlay"></div>

  <main class="crt-frame">
    <div class="crt-screen">
      <div class="scanlines"></div>

      <header class="site-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">dexxnt</span>
        </div>
        <nav class="social-links">
          <a href="https://github.com/dexxnt" target="_blank" rel="noopener" title="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.instagram.com/dexxnt/" target="_blank" rel="noopener" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </nav>
      </header>

      <h1 class="glitch-title" data-text="Proyectos_">Proyectos_</h1>

      <div class="projects-container">
        <!-- Directory listing on the left -->
        <div class="projects-content">
          <div class="dos-header">
            <span>C:\PROYECTOS> DIR</span>
          </div>
          
          <div class="dos-table-header">
            <span class="col-name">Name</span>
            <span class="col-type">Type</span>
            <span class="col-date">Date</span>
          </div>
          
          <div class="dos-list" id="projects-list">
            <!-- Populated by JS -->
          </div>
          
          <div class="dos-footer">
            <span id="files-count">0 File(s)</span>
            <span id="bytes-free">429,496,729 bytes free</span>
          </div>
        </div>

        <!-- Project Inspector on the right -->
        <aside class="project-inspector">
          <div id="inspector-content" class="inspector-default">
             <i class="fa-solid fa-terminal pulse-icon"></i>
             <p>Select an executable file to inspect...</p>
          </div>
        </aside>
      </div>

      <!-- Filesystem Navigation -->
      <nav class="filesystem-nav" id="fs-nav">
        <div class="fs-header">
          <span>Filesystem</span>
          <button class="fs-toggle" id="fs-toggle" title="Toggle Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div class="fs-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
          <a href="about.html"><i class="fa-solid fa-ghost"></i> Sobre mi</a>
          <a href="musica.html"><i class="fa-solid fa-music"></i> Música</a>
          <a href="juegos.html"><i class="fa-solid fa-gamepad"></i> Jueguitos</a>
          <a href="proyectos.html" class="active"><i class="fa-solid fa-address-book"></i> Proyectos</a>
          <a href="contacto.html"><i class="fa-solid fa-envelope"></i> Contacto</a>
        </div>
      </nav>

    </div>
  </main>

  <script src="js/glitch.js"></script>
  <script>
    const fsNav = document.getElementById('fs-nav');
    const fsToggle = document.getElementById('fs-toggle');
    fsToggle.addEventListener('click', () => {
      fsNav.classList.toggle('collapsed');
    });

    // Project Data
    const projectsData = [
      {
        id: 'nuppy',
        name: 'Nuppy.exe',
        type: 'Universidad',
        date: '12-17-25',
        title: 'Nuppy',
        desc: 'Primer proyecto "grande" solicitado por la universidad, donde Nuam un holding regional que integra las bolsas de valores y los servicios de post-negociación de Chile, Colombia y Perú nos solicito una actualización en el programa web que ellos utilizaban.',
        icon: 'img/projects/Nuam.png', 
        stack: [
          { name: 'JavaScript', color: '#f1e05a', icon: 'devicon-javascript-plain' },
          { name: 'Python', color: '#3572A5', icon: 'devicon-python-plain' },
          { name: 'HTML', color: '#e34c26', icon: 'devicon-html5-plain' },
          { name: 'CSS', color: '#563d7c', icon: 'devicon-css3-plain' }
        ],
        repoUrl: 'https://github.com/bnjaminn/Proyecto-Nuppy/commits/master/',
        liveUrl: '#'
      },
      {
        id: 'mauleconecta',
        name: 'MauleConecta.php',
        type: 'Practica/Trabajo',
        date: '03-24-26',
        title: 'MauleConecta',
        desc: 'Proyecto construido en base a laravel php y MySQL es un Marketplace regional que conecta a las diferentes pymes para que puedan ofrecer y vender sus productos gestionados con envió todo desde la misma plataforma.',
        icon: 'img/projects/mauleconecta.png', 
        stack: [
          { name: 'Laravel', color: '#ff2d20', icon: 'devicon-laravel-plain' },
          { name: 'PHP', color: '#777bb4', icon: 'devicon-php-plain' },
          { name: 'MySQL', color: '#4479a1', icon: 'devicon-mysql-plain' }
        ],
        repoUrl: 'https://www.mauleconecta.cl/',
        liveUrl: '#'
      },
      {
        id: 'visitapica',
        name: 'VisitaPica.cl',
        type: 'Trabajo',
        date: '04-24-26',
        title: 'VisitaPica',
        desc: 'Proyecto construido en base a php, JavaScript MySQL yTypeScript es una pagina solicitada por la municipalidad orientada al turismo para conocer mejor la comuna y localidad del pueblo.',
        icon: 'img/projects/logo-pagina-pica.png', 
        stack: [
          { name: 'PHP', color: '#777bb4', icon: 'devicon-php-plain' },
          { name: 'JavaScript', color: '#f1e05a', icon: 'devicon-javascript-plain' },
          { name: 'TypeScript', color: '#3b82f6', icon: 'devicon-typescript-plain' },
          { name: 'MySQL', color: '#4479a1', icon: 'devicon-mysql-plain' }
        ],
        repoUrl: 'https://www.pica.cl/',
        liveUrl: '#'
      },
      {
        id: 'kepaminimarket',
        name: 'KepaMinimarket.exe',
        type: 'Trabajo',
        date: '04-31-26',
        title: 'KepaMinimarket',
        desc: 'Proyecto construido en base a php, JavaScript MySQL y Laravel es una aplicación web encargada de administrar operaciones POS inventario, sucursales de un minimarket.',
        icon: 'img/projects/mmc logo.png', 
        stack: [
          { name: 'PHP', color: '#777bb4', icon: 'devicon-php-plain' },
          { name: 'JavaScript', color: '#f1e05a', icon: 'devicon-javascript-plain' },
          { name: 'MySQL', color: '#4479a1', icon: 'devicon-mysql-plain' },
          { name: 'Laravel', color: '#ff2d20', icon: 'devicon-laravel-plain' }
        ],
        repoUrl: '#',
        liveUrl: '#'
      }
    ];

    const listContainer = document.getElementById('projects-list');
    const filesCountSpan = document.getElementById('files-count');
    
    filesCountSpan.innerText = `${projectsData.length} File(s)`;

    function renderList() {
      projectsData.forEach(proj => {
        const item = document.createElement('div');
        item.className = 'dos-item';
        item.setAttribute('data-id', proj.id);
        
        item.innerHTML = `
          <span class="col-name">${proj.name}</span>
          <span class="col-type">${proj.type}</span>
          <span class="col-date">${proj.date}</span>
        `;
        
        item.addEventListener('click', () => {
          document.querySelectorAll('.dos-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          showProjectDetails(proj);
        });
        
        listContainer.appendChild(item);
      });
    }

    function showProjectDetails(proj) {
      const inspector = document.getElementById('inspector-content');
      
      let stackHtml = '';
      proj.stack.forEach(tech => {
        stackHtml += `
          <div class="tech-badge" style="border-color: ${tech.color}; color: ${tech.color}">
            <i class="${tech.icon}"></i> ${tech.name}
          </div>
        `;
      });

      inspector.innerHTML = `
        <div class="inspector-header">
          <div class="inspector-icon">
            <img src="${proj.icon}" alt="${proj.title}" onerror="this.src='img/foto-de-perfil.jpg'" />
          </div>
          <h2 class="inspector-title">${proj.title}</h2>
        </div>
        
        <div class="inspector-body">
          <p class="inspector-desc">> ${proj.desc}</p>
          
          <div class="inspector-stack">
            ${stackHtml}
          </div>
        </div>
        
        <div class="inspector-actions" style="justify-content: center;">
          <a href="${proj.repoUrl}" target="_blank" class="action-btn btn-repo" style="flex: 0 1 50%;"><i class="fa-brands fa-github"></i> Código</a>
        </div>
      `;
      
      // Glitch effect on update
      inspector.classList.remove('glitch-update');
      void inspector.offsetWidth; // trigger reflow
      inspector.classList.add('glitch-update');
    }

    // Initialize
    renderList();
  </script>
</body>

</html>
