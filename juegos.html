<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dexxnt | Jueguitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=1.3" />
</head>

<body>
  <div class="frame-overlay"></div>

  <main class="crt-frame">
    <div class="crt-screen">
      <div class="scanlines"></div>

      <header class="site-header">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">dexxnt</span>
        </div>
        <nav class="social-links">
          <a href="https://github.com/dexxnt" target="_blank" rel="noopener" title="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.instagram.com/dexxnt/" target="_blank" rel="noopener" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </nav>
      </header>

      <h1 class="glitch-title" data-text="Jueguitos_">Jueguitos_</h1>

      <div class="music-container">
        <div class="meta-bar">
          <span id="meta-left">&nbsp;</span>
        </div>

        <div class="win-frame">
          <div class="win-titlebar">
            <span class="win-path">~/Games</span>
            <span class="win-controls">
              <span class="win-btn" aria-hidden="true">&minus;</span>
              <span class="win-btn" aria-hidden="true">&#9633;</span>
              <span class="win-btn" aria-hidden="true">&times;</span>
            </span>
          </div>
          <div class="win-body" id="win-body">
            <p class="win-status">&gt; cargando...</p>
          </div>
        </div>
      </div>

      <!-- Filesystem Navigation -->
      <nav class="filesystem-nav" id="fs-nav">
        <div class="fs-header">
          <span>Filesystem</span>
          <button class="fs-toggle" id="fs-toggle" title="Toggle Menu"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div class="fs-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
          <a href="about.html"><i class="fa-solid fa-ghost"></i> Sobre mi</a>
          <a href="musica.html"><i class="fa-solid fa-music"></i> Música</a>
          <a href="juegos.html" class="active"><i class="fa-solid fa-gamepad"></i> Jueguitos</a>
          <a href="proyectos.html"><i class="fa-solid fa-address-book"></i> Proyectos</a>
          <a href="contacto.html"><i class="fa-solid fa-envelope"></i> Contacto</a>
        </div>
      </nav>

    </div>
  </main>

  <script src="js/glitch.js"></script>
  <script src="js/juegos.js"></script>
  <script>
    const fsNav = document.getElementById('fs-nav');
    const fsToggle = document.getElementById('fs-toggle');
    fsToggle.addEventListener('click', () => {
      fsNav.classList.toggle('collapsed');
    });
  </script>
</body>

</html>
